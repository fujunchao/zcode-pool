name: Check

on:
  workflow_dispatch:
  push:
    branches: ['main', 'feat/**', 'codex/**']

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: npm install

      - name: i18n 词条检查
        run: npm run check:i18n

      - name: 注册回调回归测试
        run: npm run test:reg

      - name: 前端构建
        if: ${{ !cancelled() }}
        run: npm run build

      - name: cargo test（Rust 单元测试）
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: ./scripts/test-rust-windows.ps1

      - name: 原生 WebView2 授权回调冒烟测试（仅本地测试页）
        timeout-minutes: 5
        run: ./scripts/test-rust-windows.ps1 -Smoke

      - name: 原生 WebView2 窗口布局回归（仅空白窗口）
        timeout-minutes: 5
        run: ./scripts/test-rust-windows.ps1 -LayoutSmoke
