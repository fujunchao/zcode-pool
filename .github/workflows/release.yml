name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # 手动派发（非 tag）时兜底用的发布标签 —— **发版时只改这一处**：tagName 与便携版附件上传都读它
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.8' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Z·POOL ${{ github.ref_name }}'
          releaseBody: |
            本版改进

            - **登录窗口自动平铺**：并行注册时登录窗口不再层叠遮挡——每打开一个新窗口，会把
              当时所有登录窗口一起排成互不重叠的网格、整组居中在主窗口所在的屏幕上（自动避开
              任务栏）。2~3 并发时一排并开，滑验证码无需再手动摆窗口。
            - 注册助手抽屉工具栏新增 **「整理窗口」** 按钮（多任务时显示）：窗口被手动拖乱后，
              一键重新平铺归位。

            下载：Windows `*_x64-setup.exe` · macOS `*_universal.dmg` · Linux `*.deb` / `*.AppImage`

            程序未签名，首次运行系统可能提示来源未知。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} ', matrix.target) || '' }}--bundles ${{ matrix.bundles }}

      # 便携版（免安装裸 exe）原先只在 build 工作流的 artifact 里（要登录 GitHub 才能下），
      # 这里额外把它附到同一个 release 上 —— 发布页直接给出「安装版」与「便携版」两种选择。
      - name: Stage portable exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/zcode-pool.exe" "zcode-pool_${ver}_portable.exe"
          Get-Item "zcode-pool_${ver}_portable.exe" | Select-Object Name, Length

      - name: Attach portable exe to release
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          gh release upload "${{ env.RELEASE_TAG }}" "zcode-pool_${ver}_portable.exe" --clobber
