name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.5' }}
          releaseName: 'Z·POOL ${{ github.ref_name }}'
          releaseBody: |
            本版改进

            - **临时邮箱取链更稳（不再被逼手动粘贴）**：临时邮箱接口的请求统一改为 3 次尝试 + 0.4s / 1.6s 退避，
              单次超时收紧为整体 10s / 建连 5s —— 自部署实例偶发握手超时或连接被重置时（实测同一分钟内会出现：
              超时 / 连接重置 / 成功各一次），通常十几秒内自愈，而不是干等 20 秒后报错回退到手动粘贴。
              建址等写操作只重试连接层错误，避免重复开箱。
            - 顺带修掉前两版遗留的两个小问题：临时邮箱连通性测试改报真实邮件总数（原先拿单页条数当总数，
              显示成「可见 1 封」）；控制台「查看邮件」对临时邮箱地址可用，主题按 RFC2047 正确解码
              （Q/B 编码、相邻编码字、`=3F` 与软换行截断场景）。

            下载：Windows `*_x64-setup.exe` · macOS `*_universal.dmg` · Linux `*.deb` / `*.AppImage`

            程序未签名，首次运行系统可能提示来源未知。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} ', matrix.target) || '' }}--bundles ${{ matrix.bundles }}
