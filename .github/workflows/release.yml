name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # 手动派发（非 tag）时兜底用的发布标签 —— **发版时只改这一处**：tagName 与便携版附件上传都读它
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.16' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Z·POOL ${{ env.RELEASE_TAG }}'
          releaseBody: |
            本版改进

            - **修复 Windows 注册完成后主界面突然前置**：关闭当前焦点注册窗前，
              按固定槽位顺序把焦点交给另一扇已显示的注册窗，避免主界面挡住新补位窗。
            - **只在必要时交接**：关闭后台窗口、用户已主动切回主界面或其他程序时不干预；
              不唤醒隐藏/最小化窗口，不使用模拟按键、始终置顶或延迟强抢焦点。
            - **统一注册窗生命周期**：自动完成、失败、跳过和标题栏关闭共用关闭监听，
              名额仍在原生窗口销毁后释放；日志补充交接结果，不记录邮箱或输入内容。
            - **新增真实焦点回归**：复现旧窗连续关闭、新补位窗从未激活的场景，
              通过系统前台事件检查主界面是否瞬间抢到焦点，并验证用户主动切走时不被打断。
            - 保留 v0.2.15 的三窗自适应平铺、稳定补位和整理，以及既有注册流程；
              macOS、Linux X11/Wayland 的原有焦点行为不变，继续执行三平台原生回归。

            下载：Windows `*_x64-setup.exe` / `*_portable.exe` · macOS `*_universal.dmg` · Linux `*.deb` / `*.AppImage`

            程序未签名，首次运行系统可能提示来源未知。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} ', matrix.target) || '' }}--bundles ${{ matrix.bundles }}

      # 便携版（免安装裸 exe）原先只在 build 工作流的 artifact 里（要登录 GitHub 才能下），
      # 这里额外把它附到同一个 release 上 —— 发布页直接给出「安装版」与「便携版」两种选择。
      - name: Stage portable exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/zcode-pool.exe" "zcode-pool_${ver}_portable.exe"
          Get-Item "zcode-pool_${ver}_portable.exe" | Select-Object Name, Length

      - name: Attach portable exe to release
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          gh release upload "${{ env.RELEASE_TAG }}" "zcode-pool_${ver}_portable.exe" --clobber
