name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # 手动派发（非 tag）时兜底用的发布标签 —— **发版时只改这一处**：tagName 与便携版附件上传都读它
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.7' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Z·POOL ${{ github.ref_name }}'
          releaseBody: |
            本版改进

            - **批量注册并发化**：邮箱页「批量验证」由逐个串行改为**并发池**——工具栏新增「并发」选择器
              （1–5，默认 **2**，运行中锁定，写入本机设置）：同时最多开对应数量的注册窗口，每个邮箱
              独立窗口 / 独立会话 / 独立设备指纹，互不干扰。
            - **多任务可见可控**：注册助手抽屉改为多任务卡视图——每张卡显示邮箱、状态、当前阶段和
              最近日志，可单独「打开窗口」或「跳过该账号」；进度区实时列出进行中的邮箱；注册窗口
              标题自动附上对应邮箱，方便分辨。
            - 错峰启动（约 1.2 秒 + 随机抖动）与精确收口：每个邮箱的结果按流程配对，OAuth 完成 /
              手动跳过 / 关闭窗口三种情况都能正确收尾并自动补位下一个。
            - **修复**：取验证邮件时回写邮箱凭据没有加锁，多任务并行可能互相覆盖（本版补上锁）。

            下载：Windows `*_x64-setup.exe` · macOS `*_universal.dmg` · Linux `*.deb` / `*.AppImage`

            程序未签名，首次运行系统可能提示来源未知。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} ', matrix.target) || '' }}--bundles ${{ matrix.bundles }}

      # 便携版（免安装裸 exe）原先只在 build 工作流的 artifact 里（要登录 GitHub 才能下），
      # 这里额外把它附到同一个 release 上 —— 发布页直接给出「安装版」与「便携版」两种选择。
      - name: Stage portable exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/zcode-pool.exe" "zcode-pool_${ver}_portable.exe"
          Get-Item "zcode-pool_${ver}_portable.exe" | Select-Object Name, Length

      - name: Attach portable exe to release
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          gh release upload "${{ env.RELEASE_TAG }}" "zcode-pool_${ver}_portable.exe" --clobber
