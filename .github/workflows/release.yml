name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # 手动派发（非 tag）时兜底用的发布标签 —— **发版时只改这一处**：tagName 与便携版附件上传都读它
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.19' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Z·POOL ${{ env.RELEASE_TAG }}'
          releaseBody: |
            本版修复

            - **自动取链不再被一次网络抖动打断**：以前取验证链接时，只要有一次 Graph 请求失败
              （网络抖动、502/503、超时），就会立刻放弃并弹「手动粘贴」——90 秒的等待窗口一秒都没
              等满；现在只有凭据失效才会放弃，其余错误记一条日志后继续等满窗口。
            - **等待时间改成真正的 90 秒**：以前是「30 次 × 3 秒」的名义值，每轮还要叠加一次网络
              往返，界面显示的「已等 X 秒」和真实耗时也对不上；现在按墙钟计时，日志直接写
              「已等 a 秒，还剩 b 秒（第 c 次查询）」，单次请求也不会把窗口拖过截止点。
            - **手动框背后继续等邮件**：转到手动粘贴后，助手仍在后台每 5 秒查一次邮箱（最多 10 分钟），
              邮件晚到会自动填入并提交、粘贴框自动消失，不用再手贴。
            - **手动框新增「从剪贴板粘贴」**：一键把链接填进去；WebView 不支持剪贴板 API 时按钮自动隐藏。
            - **收口更稳**：链接一旦打开、流程结束或你已经手贴，后台轮询立刻停止；同一链接不会重复下发，
              避免把已经走到授权页的流程拽回上一步。
            - 其余行为不变：邮箱源（Outlook / Cloudflare 临时邮箱 / M365 catch-all）、并发注册、
              滑块验证时机、日志地址脱敏都保持原样。

            下载：Windows `*_x64-setup.exe` / `*_portable.exe` · macOS `*_universal.dmg` · Linux `*.deb` / `*.AppImage`

            程序未签名，首次运行系统可能提示来源未知。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} ', matrix.target) || '' }}--bundles ${{ matrix.bundles }}

      # 便携版（免安装裸 exe）原先只在 build 工作流的 artifact 里（要登录 GitHub 才能下），
      # 这里额外把它附到同一个 release 上 —— 发布页直接给出「安装版」与「便携版」两种选择。
      - name: Stage portable exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/zcode-pool.exe" "zcode-pool_${ver}_portable.exe"
          Get-Item "zcode-pool_${ver}_portable.exe" | Select-Object Name, Length

      - name: Attach portable exe to release
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          gh release upload "${{ env.RELEASE_TAG }}" "zcode-pool_${ver}_portable.exe" --clobber
