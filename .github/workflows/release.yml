name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # 手动派发（非 tag）时兜底用的发布标签 —— **发版时只改这一处**：tagName 与便携版附件上传都读它
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.14' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Z·POOL ${{ env.RELEASE_TAG }}'
          releaseBody: |
            本版改进

            - **v0.2.14 补丁：修复 Linux X11 偶发抢焦点**。新窗口显示前明确关闭 GTK
              映射时自动激活；人工点击“打开登录窗口”仍可正常获取焦点。增加连续八轮
              X11 原生布局/焦点回归，保留 Wayland 验证。本版同时包含 v0.2.13 的全部优化：
            - **并发名额不再超额**：启动等待与初始化均预占名额，多个任务同时完成时
              不会重复补位；停止批次后，迟到的旧窗口只清理自身，不影响新批次。
            - **窗口始终优先留在工作区内**：根据实际工作区和显示缩放平铺，放不下时
              改为屏内层叠；新窗口复用空槽，不移动正在操作的旧窗口。
            - **整理窗口更可靠**：保留批次预计容量、统一恢复尺寸，并等待原生窗口事件
              生效；macOS 跨屏按目标缩放定位，批量补位不抢焦点。
            - **平台能力适配**：Linux Wayland 由合成器决定位置，不会因为缺少全局坐标
              而拒绝打开登录窗口；整理与可见性校验适配 GTK 客户端装饰。
            - **接住过早到达的注册消息**：页面填表请求或最终结果先于开窗响应时，按
              flow 暂存并在绑定邮箱后重放，失败不会被记成成功，重复通知不会重复计数。
            - 增加并发调度、早期消息、工作区布局及 Windows/macOS/Linux 原生窗口回归。
              保留人工滑块验证、授权回调双通道和原有超时策略；构建打包统一走 GitHub Actions。

            下载：Windows `*_x64-setup.exe` / `*_portable.exe` · macOS `*_universal.dmg` · Linux `*.deb` / `*.AppImage`

            程序未签名，首次运行系统可能提示来源未知。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} ', matrix.target) || '' }}--bundles ${{ matrix.bundles }}

      # 便携版（免安装裸 exe）原先只在 build 工作流的 artifact 里（要登录 GitHub 才能下），
      # 这里额外把它附到同一个 release 上 —— 发布页直接给出「安装版」与「便携版」两种选择。
      - name: Stage portable exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/zcode-pool.exe" "zcode-pool_${ver}_portable.exe"
          Get-Item "zcode-pool_${ver}_portable.exe" | Select-Object Name, Length

      - name: Attach portable exe to release
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          gh release upload "${{ env.RELEASE_TAG }}" "zcode-pool_${ver}_portable.exe" --clobber
