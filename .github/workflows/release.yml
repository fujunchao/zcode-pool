name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # 手动派发（非 tag）时兜底用的发布标签 —— **发版时只改这一处**：tagName 与便携版附件上传都读它
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.17' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Z·POOL ${{ env.RELEASE_TAG }}'
          releaseBody: |
            本版新增

            - **新增 Microsoft 365 catch-all 邮箱源**：在「设置 → Microsoft 365 catch-all」填入租户 ID、
              应用（客户端）ID、收信邮箱与生成地址的域名，用设备码登录一次，之后取信全程静默。
            - **Graph 取信 + 按收件人归因**：一个 catch-all 邮箱服务全部并发注册流程，按邮件的
              to/cc 精确匹配本次注册地址，且只接受 /auth/verify_email 链接 —— 欢迎信里的普通链接
              不会被误用；已消费消息不重复使用，并发注册不串号。
            - **单飞取信与限流**：收件箱 + 垃圾箱的薄列表快照 1.5 秒内复用，命中后才补取单封正文，
              峰值 2 次并发请求，低于 Graph 每邮箱 4 并发的限制；日志里的邮箱地址做脱敏。
            - **地址现场生成**：邮箱库新增「生成地址」，批量生成 <10 位字母数字>@域名 并入库，
              可直接勾选去跑批量注册。
            - 保留原有 Outlook 与 cloudflare 临时邮箱源，行为不变；未配置 M365 时不会进入该分支。
            - 委派模式要求 Entra 应用开启「允许公共客户端流」并授予 Graph 委派权限 Mail.Read
              （共享邮箱再加 Mail.Read.Shared）；凭据只保存在本机 ~/.zcode-pool/settings.json。

            下载：Windows `*_x64-setup.exe` / `*_portable.exe` · macOS `*_universal.dmg` · Linux `*.deb` / `*.AppImage`

            程序未签名，首次运行系统可能提示来源未知。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} ', matrix.target) || '' }}--bundles ${{ matrix.bundles }}

      # 便携版（免安装裸 exe）原先只在 build 工作流的 artifact 里（要登录 GitHub 才能下），
      # 这里额外把它附到同一个 release 上 —— 发布页直接给出「安装版」与「便携版」两种选择。
      - name: Stage portable exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/zcode-pool.exe" "zcode-pool_${ver}_portable.exe"
          Get-Item "zcode-pool_${ver}_portable.exe" | Select-Object Name, Length

      - name: Attach portable exe to release
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          gh release upload "${{ env.RELEASE_TAG }}" "zcode-pool_${ver}_portable.exe" --clobber
