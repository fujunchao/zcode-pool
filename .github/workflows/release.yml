name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # 手动派发（非 tag）时兜底用的发布标签 —— **发版时只改这一处**：tagName 与便携版附件上传都读它
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.12' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Z·POOL ${{ env.RELEASE_TAG }}'
          releaseBody: |
            本版改进

            - **修复注册后可能停留在「授权成功，正在跳转到应用」的问题**：登录驱动改用
              不触发页面导航的 IPC 通道上报状态，不再与真正的 OAuth 回调争用主窗口导航。
            - **纠正进度状态**：点击授权后显示「等待授权回调」，只有后台真正保存账号后
              才显示「入库完成」；迟到的网页消息不会覆盖已完成或失败的状态。
            - **最小权限与诊断**：登录网页只能上报自己的注册流程；补充 WebView2 导航
              失败码及轮询重试/恢复日志，授权码、验证链接参数和短信验证码不再写入相关日志。
            - 新增快速/慢速回调、IPC 异常、并发流程、宿主权限及原生 WebView2 本地回调
              回归测试。编译、测试与多平台安装包统一由 GitHub Actions 完成。
            - 保持人工滑块验证、固定窗口槽位、深链接/轮询双通道与原有超时策略不变。

            下载：Windows `*_x64-setup.exe` / `*_portable.exe` · macOS `*_universal.dmg` · Linux `*.deb` / `*.AppImage`

            程序未签名，首次运行系统可能提示来源未知。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} ', matrix.target) || '' }}--bundles ${{ matrix.bundles }}

      # 便携版（免安装裸 exe）原先只在 build 工作流的 artifact 里（要登录 GitHub 才能下），
      # 这里额外把它附到同一个 release 上 —— 发布页直接给出「安装版」与「便携版」两种选择。
      - name: Stage portable exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/zcode-pool.exe" "zcode-pool_${ver}_portable.exe"
          Get-Item "zcode-pool_${ver}_portable.exe" | Select-Object Name, Length

      - name: Attach portable exe to release
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          gh release upload "${{ env.RELEASE_TAG }}" "zcode-pool_${ver}_portable.exe" --clobber
