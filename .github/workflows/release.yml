name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.4' }}
          releaseName: 'Z·POOL ${{ github.ref_name }}'
          releaseBody: |
            本版新增 / 改进

            - **临时邮箱源（Cloudflare）**：邮箱库可接入自部署的 cloudflare_temp_email 实例 —— 设置页填好服务地址与凭据后，
              可在邮箱库「现场建址」一键开箱，注册 / 登录链路从临时邮箱自动取验证链接；与 Outlook 通道并存，来源按收信域名自动识别。
            - **「导出到 zcode2api-plus」**：账号库新增专属导出，一键生成 zcode2api-plus 的 `providers` v1 导入文件 ——
              只含账号名与登录 JWT；加密凭据会在本机先解密，解不开的账号自动跳过并列在结果里；不含邮箱、供应商配置与设备身份。

            修复 / 改进

            - 控制台「查看邮件」支持临时邮箱源（字段与 Graph 通道对齐），主题按 RFC2047 正确解码（Q/B 编码、相邻编码字、=3F 与软换行截断场景）。
            - 临时邮箱连通性测试改报真实邮件总数（原先拿单页条数当总数，显示成「可见 1 封」）。
            - CI：新增 check 工作流（i18n 词条 + 前端构建 + Rust 单测），main 与特性分支推送即触发。

            下载：Windows `*_x64-setup.exe` · macOS `*_universal.dmg` · Linux `*.deb` / `*.AppImage`

            程序未签名，首次运行系统可能提示来源未知。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} ', matrix.target) || '' }}--bundles ${{ matrix.bundles }}
