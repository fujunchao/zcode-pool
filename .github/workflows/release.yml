name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # 手动派发（非 tag）时兜底用的发布标签 —— **发版时只改这一处**：tagName 与便携版附件上传都读它
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.10' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Z·POOL ${{ github.ref_name }}'
          releaseBody: |
            本版改进

            - **修复邮箱库「全选」在邮箱全部变为「已验证」后点击无效**：此前全选逻辑只处理
              「待验证」的行、复选框勾选态也只按「待验证」行重算 —— 视图里没有待验证邮箱时，
              点击全选会被重渲染「弹回」。现改为全选覆盖**当前筛选视图的全部行**，与行级勾选
              行为一致：已验证 / 失败 / 无效的邮箱均可被全选，便于批量清理等操作。
            - 「批量验证」按钮的计数与禁用改为只统计选中项中「待验证」的邮箱，
              与该按钮实际覆盖范围一致。
            - 邮箱库全选框补充「部分选中」状态显示（与账号库一致）。

            （批量验证流程不受影响：始终只对「待验证」邮箱发起；选择范围放宽只为批量管理服务。）

            下载：Windows `*_x64-setup.exe` · macOS `*_universal.dmg` · Linux `*.deb` / `*.AppImage`

            程序未签名，首次运行系统可能提示来源未知。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} ', matrix.target) || '' }}--bundles ${{ matrix.bundles }}

      # 便携版（免安装裸 exe）原先只在 build 工作流的 artifact 里（要登录 GitHub 才能下），
      # 这里额外把它附到同一个 release 上 —— 发布页直接给出「安装版」与「便携版」两种选择。
      - name: Stage portable exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/zcode-pool.exe" "zcode-pool_${ver}_portable.exe"
          Get-Item "zcode-pool_${ver}_portable.exe" | Select-Object Name, Length

      - name: Attach portable exe to release
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          gh release upload "${{ env.RELEASE_TAG }}" "zcode-pool_${ver}_portable.exe" --clobber
